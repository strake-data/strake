[advisories]
ignore = [
    "RUSTSEC-2023-0071", # rsa timing sidechannel
    "RUSTSEC-2025-0052", # async-std discontinued
    "RUSTSEC-2021-0141", # dotenv unmaintained
    "RUSTSEC-2025-0119", # number_prefix unmaintained
    "RUSTSEC-2024-0436", # paste unmaintained
    "RUSTSEC-2026-0118", # hickory-proto NSEC3 unbounded loop
    "RUSTSEC-2026-0119", # hickory-proto CPU exhaustion
    "RUSTSEC-2026-0173", # proc-macro-error2 unmaintained fork
    "RUSTSEC-2026-0177", # pyo3 missing Sync bound on new_closure
    "RUSTSEC-2026-0176", # pyo3 out-of-bounds read in nth / nth_back
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[[bans.skip]]
name = "async-channel"
version = "1.9.0"

[[bans.skip]]
name = "md-5"
version = "0.10.6"

[[bans.skip]]
name = "lz4_flex"
version = "0.11.6"

[[bans.skip]]
name = "linux-raw-sys"
version = "0.4.15"

[[bans.skip]]
name = "wit-bindgen"
version = "0.51.0"

[[bans.skip]]
name = "zip"
version = "0.6.6"

[[bans.skip]]
name = "core-foundation"
version = "0.9.4"

[[bans.skip]]
name = "core-foundation"
version = "0.10.1"

[[bans.skip]]
name = "cpufeatures"
version = "0.2.17"

[[bans.skip]]
name = "cpufeatures"
version = "0.3.0"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-git = [
    "https://github.com/apache/iceberg-rust",
    "https://github.com/apache/opendal",
]

[[bans.skip]]
name = "event-listener"
version = "2.5.3"

[[bans.skip]]
name = "event-listener"
version = "5.4.1"

[[bans.skip]]
name = "fallible-iterator"
version = "0.2.0"

[[bans.skip]]
name = "fallible-iterator"
version = "0.3.0"

[[bans.skip]]
name = "foldhash"
version = "0.1.5"

[[bans.skip]]
name = "foldhash"
version = "0.2.0"

[[bans.skip]]
name = "getrandom"
version = "0.2.17"

[[bans.skip]]

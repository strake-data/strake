[advisories]
ignore = [
    "RUSTSEC-2023-0071", # rsa timing sidechannel
    "RUSTSEC-2025-0052", # async-std discontinued
    "RUSTSEC-2021-0141", # dotenv unmaintained
    "RUSTSEC-2025-0119", # number_prefix unmaintained
    "RUSTSEC-2024-0436", # paste unmaintained
    "RUSTSEC-2026-0037", # quinn-proto DoS
    "RUSTSEC-2024-0373", # quinn-proto panic
    "RUSTSEC-2023-0063", # quinn-proto DoS
    "RUSTSEC-2026-0041", # lz4_flex memory leak
    "RUSTSEC-2026-0068", # tar PAX size headers
    "RUSTSEC-2026-0067", # tar unpack_in chmod
    "RUSTSEC-2026-0002", # lru IterMut Stacked Borrows
    "GHSA-h395-gr6q-cpjc", # jsonwebtoken type confusion
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[[bans.skip]]
name = "arrow"
version = "56.1.0"


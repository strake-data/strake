[advisories]
ignore = [
    "RUSTSEC-2023-0071", # rsa timing sidechannel
    "RUSTSEC-2025-0052", # async-std discontinued
    "RUSTSEC-2021-0141", # dotenv unmaintained
    "RUSTSEC-2025-0119", # number_prefix unmaintained
    "RUSTSEC-2024-0436", # paste unmaintained
    "RUSTSEC-2026-0118", # hickory-proto NSEC3 unbounded loop
    "RUSTSEC-2026-0119", # hickory-proto CPU exhaustion
    "RUSTSEC-2026-0175", # pyo3 missing Sync bound on new_closure
    "RUSTSEC-2026-0176", # pyo3 out-of-bounds read in nth / nth_back
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"


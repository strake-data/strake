name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, dev-*]
  pull_request:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running CI'
        required: false
        default: 'Manual trigger'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  STRAKE_LICENSE_PUBKEY_PATH: ${{ github.workspace }}/keys/public.pem

jobs:
  lint:
    name: Lint & Security
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Generate Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 1

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-protoc

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: Setup Enterprise Key
        run: |
          mkdir -p keys
          echo "${{ secrets.STRAKE_LICENSE_PUBKEY }}" > keys/public.pem

      - name: Print trigger reason
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Manual trigger reason: ${{ github.event.inputs.reason }}"

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Cargo Deny
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Verify Architecture (Domain Isolation)
        run: |
          cargo tree -p strake-common --no-dev-dependencies --edges normal --prefix none | \
            grep -qE "^datafusion[^-]|^datafusion$" && \
            (echo "ERROR: strake-common must not depend on datafusion" && exit 1) || true
          cargo tree -p strake-common --no-dev-dependencies --edges normal --prefix none | \
            grep -qE "^arrow[^-]|^arrow$" && \
            (echo "ERROR: strake-common must not depend on arrow" && exit 1) || true

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Generate Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 1

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-protoc

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
      
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: Setup Enterprise Key
        run: |
          mkdir -p keys
          echo "${{ secrets.STRAKE_LICENSE_PUBKEY }}" > keys/public.pem

      - name: Run Unit Tests
        run: cargo test --workspace --all-features --exclude strake-tpch-smoke-test
        env:
          STRAKE_LICENSE_KEY: ${{ secrets.STRAKE_LICENSE_KEY }}

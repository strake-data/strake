[workspace]
members = ["crates/*", "python", "strake-enterprise"]
exclude = ["submodules/datafusion-table-providers"]
resolver = "2"
[workspace.package]
version = "0.2.4"
edition = "2024"
license = "Apache-2.0"
license-file = "LICENSE"
repository = "https://github.com/strake-data/strake"
description = "High-performance data federation and query acceleration."

[workspace.metadata.strake]
# Reserved for strake specific metadata

[workspace.dependencies]
# Pin exact versions to avoid dependency hell
openssl = { version = "0.10", features = ["vendored"] }
arrow = "58.0.0"
datafusion = "53.0.0"
datafusion-python = "53.0.0"
datafusion-federation = { version = "0.5.3", features = ["sql"] }
datafusion-table-providers = { path = "submodules/datafusion-table-providers/core", features = ["postgres", "mysql", "sqlite", "flight", "clickhouse"] }
arrow-flight = { version = "58.0.0", features = ["flight-sql-experimental"] }
arrow-json = "58.0.0"
parquet = "58.0.0"
datafusion-datasource-parquet = "53.0.0"
datafusion-datasource = "53.0.0"
object_store = "0.13.0"
sqlparser = "0.61.0"
datafusion-substrait = "53.0.0"
axum = "0.8.1"
reqwest = { version = "0.12", features = ["json"] }
oauth2 = "5.0"
jsonwebtoken = "10.3"
rmcp = { version = "0.12", features = ["server", "transport-io"] }
rmcp-macros = "0.12"
# MCP dependencies
mcp-core = { version = "0.1" }
clap = { version = "4.5", features = ["derive", "env"] }
dashmap = "6.1.0"
roaring = "0.10"
uuid = "1.11.0"

tokio = { version = "1.40", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
postgres-types = { version = "0.2" }
rust_decimal = { version = "1.33", features = ["db-tokio-postgres"] }
pyo3 = "0.28"
prost = "0.14.3"
prost-types = "0.14.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
secrecy = { version = "0.10", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
tonic = "0.14"
chrono = "0.4"
futures = "0.3"
async-trait = "0.1"
tower = "0.5"
url = "2.5"
parking_lot = "0.12"


# Cache serialization
sha2 = "0.10"

# Telemetry & Observability
opentelemetry = "0.31"
opentelemetry-otlp = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
tracing-opentelemetry = "0.32.1"
prometheus = { version = "0.13", default-features = false }
once_cell = "1.20"
nix = "0.29.0"
serial_test = "3.2"
temp-env = "0.3"

[profile.dev]
# Disabling debug info for dependencies speeds up linking significantly
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

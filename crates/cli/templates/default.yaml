# Strake Data Sources Configuration
# This file defines the external data sources registered in your workspace.

sources:
  - name: example_local_postgres
    # The source type (e.g., postgres, mysql, sqlite, duckdb, clickhouse, rest, grpc)
    type: postgres
    
    # Connection URL (can also use env references like ${env:POSTGRES_URL})
    url: "postgres://localhost:5432/postgres"
    
    # Optional credentials (if not embedded in the URL)
    # username: db_user
    # password: ${env:POSTGRES_PASSWORD}
    
    # Optional performance tuning parameters
    # max_concurrent_queries: 10
    # default_limit: 1000
    # predicate_cache: false

    # List of tables to federate and register from this source
    tables:
      - name: example_table
        schema: public
        columns:
          - name: id
            type: integer
            primary_key: true


[project]
site_name = "Strake Documentation"
site_url = "https://strake-data.github.io/strake/"
site_description = "Scalable and reliable data infrastructure"
site_author = "Strake Data"
repo_url = "https://github.com/strake-data/strake"
repo_name = "strake-data/strake"
copyright = "Copyright &copy; 2026 Strake Data"

extra_css = ["stylesheets/extra.css"]

nav = [
    { "Home" = "index.md" },
    { "Getting Started" = [
        { "Overview" = "getting-started/index.md" },
        { "Quickstart" = "getting-started/quickstart.md" },
        { "Installation" = "getting-started/installation.md" },
        { "Core Concepts" = "getting-started/core-concepts.md" }
    ] },
    { "User Guide" = [
        { "Configuration" = "user-guide/configuration.md" },
        { "Data Sources (Connectors)" = [
            { "Overview" = "user-guide/sources/index.md" },
            { "PostgreSQL" = "user-guide/sources/postgres.md" },
            { "MySQL" = "user-guide/sources/mysql.md" },
            { "SQLite" = "user-guide/sources/sqlite.md" },
            { "DuckDB" = "user-guide/sources/duckdb.md" },
            { "ClickHouse" = "user-guide/sources/clickhouse.md" },
            { "Oracle" = "user-guide/sources/oracle.md" },
            { "Files & Cloud Storage" = "user-guide/sources/file.md" },
            { "Apache Iceberg" = "user-guide/sources/iceberg.md" },
            { "Arrow Flight SQL" = "user-guide/sources/flight_sql.md" },
            { "REST APIs" = "user-guide/sources/rest.md" },
            { "gRPC Services" = "user-guide/sources/grpc.md" }
        ] },
        { "Command Line Interface" = [
            { "Overview" = "user-guide/cli/index.md" },
            { "Project Lifecycle" = "user-guide/cli/project-lifecycle.md" },
            { "Discovery & Inspection" = "user-guide/cli/discovery.md" },
            { "Security & Secrets" = "user-guide/cli/security.md" },
            { "Database Management" = "user-guide/cli/database.md" },
            { "API Key Management" = "user-guide/cli/apikey.md" }
        ] },
        { "Python API" = "user-guide/python-api.md" },
        { "Authentication" = "user-guide/authentication.md" },
        { "AI Metadata Enrichment" = "user-guide/metadata-enrichment.md" },
        { "Join Hints" = "user-guide/join-hints.md" },
        { "MCP Sidecar" = "user-guide/mcp.md" }
    ] },
    { "Advanced Topics" = [
        { "Overview" = "advanced/index.md" },
        { "Architecture" = "advanced/architecture.md" },
        { "Query Profiling" = "advanced/query-profiling.md" },
        { "Sandbox Metering" = "advanced/sandbox-metering.md" },
        { "Enterprise Edition" = "advanced/enterprise.md" }
    ] },
    { "Examples" = [
        { "Overview" = "examples/index.md" },
        { "Cross-Source Join" = "examples/cross-source-join.md" },
        { "GitHub REST API" = "examples/github-api.md" }
    ] }
]

[project.theme]
logo = "assets/logo.png"
features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.expand",
    "content.code.copy",
    "navigation.top",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.tracking",
    "search.highlight"
]

[project.theme.font]
text = "Inter"
code = "Roboto Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.def_list]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.tilde]

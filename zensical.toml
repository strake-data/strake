[project]
site_name = "Strake Documentation"
site_url = "https://strake-data.github.io/strake/"
site_description = "Scalable and reliable data infrastructure"
site_author = "Strake Data"
repo_url = "https://github.com/strake-data/strake"
repo_name = "strake-data/strake"
copyright = "Copyright &copy; 2026 Strake Data"

extra_css = ["stylesheets/extra.css"]

nav = [
    { "Home" = "index.md" },
    { "Guide" = [
        { "Quickstart" = "quickstart.md" },
        { "Installation" = "install.md" },
        { "Concepts" = "concepts.md" },
        { "Authentication" = "authentication.md" }
    ] },
    { "Connectors" = "connectors.md" },
    { "Architecture" = "architecture.md" },
    { "Enterprise" = "enterprise.md" },
    { "Examples" = "examples.md" },
    { "Python API" = "python-api.md" },
    { "CLI Reference" = "cli-reference.md" }
]

[project.theme]
logo = "assets/logo.png"
features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.expand",
    "content.code.copy",
    "navigation.top",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.tracking",
    "search.highlight"
]

[project.theme.font]
text = "Inter"
code = "Roboto Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.def_list]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.tilde]
